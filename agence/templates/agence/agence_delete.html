{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block content %}
    <div class="container mt-5">
        <h1>Supprimer l'Agence</h1>
        <p>Êtes-vous sûr de vouloir supprimer l'agence "{{ agence.nom }}" ? Cette action est irréversible.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
            <a href="{% url 'agence:agence_list' agence_id=agence.id %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
{% endblock %}
