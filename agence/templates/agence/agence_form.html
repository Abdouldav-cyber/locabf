{% if form_type == 'create' %}
    <h1>Créer une nouvelle Agence</h1>
{% else %}
    <h1>Modifier l'Agence</h1>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
</form>

<a href="{% url 'agence_list' %}">Annuler et retourner à la liste</a>
