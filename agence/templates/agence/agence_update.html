{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block content %}
    <div class="container mt-5">
        <h1>Modifier l'Agence</h1>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" name="nom" class="form-control" value="{{ agence.nom }}" required>
            </div>
            <div class="form-group">
                <label for="adresse">Adresse :</label>
                <textarea name="adresse" class="form-control" required>{{ agence.adresse }}</textarea>
            </div>
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" name="email" class="form-control" value="{{ agence.email }}" required>
            </div>
            <div class="form-group">
                <label for="telephone">Téléphone :</label>
                <input type="text" name="telephone" class="form-control" value="{{ agence.telephone }}" required>
            </div>
            <div class="form-group">
                <label for="siret">SIRET :</label>
                <input type="text" name="siret" class="form-control" value="{{ agence.siret }}" required>
            </div>
            <div class="form-group">
                <label for="logo">Logo (laisser vide pour ne pas changer) :</label>
                <input type="file" name="logo" class="form-control-file">
                {% if agence.logo %}
                    <p>Logo actuel : <img src="{{ agence.logo.url }}" width="100"></p>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary mt-2">Mettre à jour</button>
        </form>
    </div>
{% endblock %}
