{% extends 'base.html' %}
{% block title %}Souscription{% endblock %}
{% block content %}
    <div class="py-5">
        <div class="container">
            <h1 class="display-4 mb-4">Demande de location pour {{ maison.titre }}</h1>
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="message" class="form-label">Message au propriétaire</label>
                            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Votre message..."></textarea>
                        </div>
                        <div class="mb-4">
                            <label for="documents" class="form-label">Documents justificatifs</label>
                            <input type="file" class="form-control" id="documents" name="documents" multiple>
                            <small class="text-muted">Formats acceptés : PDF, JPG, PNG</small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Soumettre la demande</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
