{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% load static %}
{% block title %}Inscription - LOCABF{% endblock %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center"><i class="fas fa-user-plus"></i> Inscription</h2>
                        <form method="post">
                            {% csrf_token %}
                            {% bootstrap_form form layout='floating' %}
                            <button type="submit" class="btn btn-primary w-100 mt-3"><i class="fas fa-check"></i> S'inscrire</button>
                        </form>
                        <p class="text-center mt-3"><a href="{% url 'login' %}" class="link-primary"><i class="fas fa-sign-in-alt"></i> Connectez-vous</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
{% endblock %}
