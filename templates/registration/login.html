{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% load static %}
{% block title %}Connexion - LOCABF{% endblock %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center"><i class="fas fa-sign-in-alt"></i> Connexion</h2>
                        <form method="post" action="{% url 'login' %}" class="needs-validation" novalidate>
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_username" class="form-label"><i class="fas fa-user"></i> Nom d'utilisateur</label>
                                <input type="text" name="username" id="id_username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="id_password" class="form-label"><i class="fas fa-lock"></i> Mot de passe</label>
                                <input type="password" name="password" id="id_password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3"><i class="fas fa-sign-in-alt"></i> Se connecter</button>
                            <div class="text-center">
                                <a href="{% url 'password_reset' %}" class="btn btn-link"><i class="fas fa-key"></i> Mot de passe oublié</a>
                                <p><a href="{% url 'register' %}" class="link-primary"><i class="fas fa-user-plus"></i> Inscription</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/custom.js' %}"></script>
{% endblock %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
{% endblock %}
