{% extends 'base.html' %}
{% block title %}Revenus{% endblock %}
{% block content %}
    <div class="py-5 bg-light">
        <div class="container">
            <h1 class="display-4 mb-4">Mes Revenus</h1>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body text-center">
                            <i class="fas fa-euro-sign fa-2x text-primary mb-3"></i>
                            <h5 class="card-title">Revenus Mensuels</h5>
                            <p class="card-text display-6">{{ revenus_mensuels|default:"0" }}€</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body text-center">
                            <i class="fas fa-chart-line fa-2x text-primary mb-3"></i>
                            <h5 class="card-title">Revenus Annuels</h5>
                            <p class="card-text display-6">{{ revenus_annuels|default:"0" }}€</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-5">
                <h3>Historique des Revenus</h3>
                <canvas id="revenusChart" height="100"></canvas>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <script>
                    const ctx = document.getElementById('revenusChart').getContext('2d');
                    const chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin'],
                            datasets: [{
                                label: 'Revenus (€)',
                                data: [1200, 1300, 1100, 1400, 1500, 1600],
                                backgroundColor: 'rgba(0, 123, 255, 0.5)',
                                borderColor: 'rgba(0, 123, 255, 1)',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                </script>
            </div>
        </div>
    </div>
{% endblock %}
